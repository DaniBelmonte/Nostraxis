name: Feature request
description: Propose an improvement to Nostraxis.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior and important tradeoffs.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sessions
        - Analytics
        - Compare
        - Provider integration
        - Repositories
        - Documentation
        - Other
    validations:
      required: true
